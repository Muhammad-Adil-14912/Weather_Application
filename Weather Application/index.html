<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🌙 Weather Forecast</h1>
      <form id="search-form">
        <input type="text" id="city-input" placeholder="Enter city name" required>
        <button type="submit">Search</button>
      </form>
    </header>

    <main>
      <!-- Current Weather -->
      <section id="current-weather" class="card">
        <h2 id="city-name">--</h2>
        <div class="weather-info">
          <img id="weather-icon" src="" alt="Weather Icon">
          <div>
            <h3 id="temperature">-- °C</h3>
            <p id="description">--</p>
          </div>
        </div>
        <div class="details">
          <p>🌬️ Wind: <span id="wind">--</span> m/s</p>
          <p>💧 Humidity: <span id="humidity">--</span>%</p>
          <p>🌡️ Pressure: <span id="pressure">--</span> hPa</p>
        </div>
      </section>

      <!-- Forecast -->
      <section id="forecast" class="card">
        <h2>5-Day Forecast</h2>
        <div id="forecast-cards" class="forecast-grid"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
